<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronot Sağlık İzleme Sistemi - NASA Space Apps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Ekranı -->
    <div id="login-screen" hidden>
        <div class="login-card">
            <h1>Astronot Girişi</h1>
            <label>
                Kullanıcı
                <select id="login-user">
                    <option value="user1">Astronot 1</option>
                    <option value="user2">Astronot 2</option>
                    <option value="user3">Astronot 3</option>
                </select>
            </label>
            <label>
                6 Haneli Parola
                <input id="login-pass" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" placeholder="••••••">
            </label>
            <button id="login-btn" type="button">Giriş Yap</button>
        </div>
    </div>

    <button id="hexagon-btn" title="Ana Menü">⬡</button>
    <button id="cancel-menu-btn" title="İptal">✕</button>

    <main class="dashboard-container">
        <section class="left-section" id="left-section">
            <div class="photo-frame" id="initial-photo">
                <img src="/481975394_1311642796741301_4408107372293563832_n.jpg" alt="Kişisel Fotoğraf Çerçevesi">
            </div>
        </section>
        <section class="info-section">
            <div class="info-panel" id="info-panel">
                <h1 id="panel-title">Welcome</h1>
                <p id="panel-desc">More detail bla bla bla</p>
            </div>
        </section>
    </main>

    <nav id="menu" inert>
        <div class="arc-ring ring-pink"></div>
        <div class="arc-ring ring-red"></div>
        <div class="arc-ring ring-purple"></div>
        <div class="arc-ring ring-blue"></div>
        <div class="arc-ring ring-green"></div>

        <div class="menu-items-wrapper">
            <div class="ring-group" data-ring="0">
                <button class="app-btn workout" id="environment">Ortam</button>
                <button class="app-btn workout" id="space">Uzay</button>
            </div>
            <div class="ring-group" data-ring="1">
                <button class="app-btn psych" id="stabilite">Sağlamlık</button>
                <button class="app-btn psych" id="actions">Davranışlar</button>
                <button class="app-btn psych" id="tiredness">Yorgunluk</button>
            </div>
            <div class="ring-group" data-ring="2">
                <button class="app-btn input" id="standart-input">Klasik Veri</button>
                <button class="app-btn bio" id="bacteria">Bakteriler</button>
                <button class="app-btn bio" id="immunity">Bağışıklık</button>
                <button class="app-btn bio" id="diseases">Hastalıklar</button>
                <button class="app-btn input" id="settings">Ayarlar</button>
            </div>
            <div class="ring-group" data-ring="3">
                <button class="app-btn monitoring" id="heart">Kalp</button>
                <button class="app-btn monitoring" id="bone">Kemik</button>
                <button class="app-btn monitoring" id="sleep">Uyku</button>
                <button class="app-btn empty" disabled style="opacity: 0.3; cursor: default;">Boş</button>
                <button class="app-btn radiation" id="active-radiation">Radyasyon</button>
                <button class="app-btn team" id="teammates">Takım</button>
            </div>
            <div class="ring-group" data-ring="4">
                <button class="app-btn procedure" id="learn">Acil Öğren</button>
                <button class="app-btn procedure" id="standart-procedure">Prosedürler</button>
                <button class="app-btn procedure" id="emergency">Acil Durum</button>
                <button class="app-btn empty" disabled style="opacity: 0.3; cursor: default;">Boş</button>
            </div>
        </div>
    </nav>
    <div id="notif-stack" aria-live="polite"></div>
    <script src="script.js"></script>
</body>
</html>
